name: Bug report
description: Something in Nimbus doesn't work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **This issue is public.** Do **not** include colleague names, phone numbers, caller details, call data, screenshots of Storm or any other personal information. Blur or crop screenshots before adding them.
        **Dit issue is openbaar.** Zet er **geen** namen van collega's, telefoonnummers, gegevens van bellers, gespreksgegevens, screenshots van Storm of andere persoonlijke informatie in.
        Check the [FAQ](https://0xatlxs.github.io/nimbus-privacy/support/) first.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed colleague names, phone numbers, call data and personal information from this report.
          required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Nimbus version
      description: Settings → About
      placeholder: "2.0.0"
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options: [Chrome, Brave, Edge, Other]
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11, macOS 15, ...
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Ringtone, Auto pickup / alert, Status timers, Keep PC awake, Team board, Notifications, Spotify, Appearance / settings, Other]
